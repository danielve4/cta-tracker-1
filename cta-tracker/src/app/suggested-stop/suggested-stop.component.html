@if (suggestions().length) {
  <section class="suggestion-card">
    <div class="suggestion-header">
      <h3 class="suggestion-title">Welcome back — heading to your usual stop?</h3>
      <button type="button" class="suggestion-dismiss" (click)="dismiss()" aria-label="Dismiss suggestions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <ul class="suggestion-list">
      @for (suggestion of suggestions(); track suggestion.stopKey) {
        <li>
          <button type="button" class="suggestion-item" (click)="open(suggestion)">
            <span class="suggestion-stop">{{ suggestion.event.stopName }}</span>
            <span class="suggestion-route">{{ label(suggestion) }}</span>
          </button>
        </li>
      }
    </ul>
  </section>
}
