@if (line) {
  <h2 class="cols-4" [style.color]="'#' + line.color">{{ line.name }}</h2>
}
<section class="cols-4 search-form">
  <input class="search-input" id="search-stations" #criteria (input)="search(criteria.value)" autocomplete="off" required />
  <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <label class="search-label" for="search-stations">Search Stations</label>
</section>

<ul class="cols-4">
  @if (stops$ | async; as stops) {
    @for (stop of stops; track stop.id) {
      <li class="train-stop">
        <a routerLink="/train-arrivals/{{ routeId }}/{{ stop.id }}/{{ replaceSlash(stop.name) }}">
          @if (line) {
            <span class="stop-dot" [style.backgroundColor]="'#' + line.color"></span>
          }
          <span class="stop-name">{{ stop.name }}</span>
        </a>
      </li>
    }
  }
</ul>
