<h2 class="cols-4">Route {{ forRoute }} {{ forDirection }}</h2>
<section class="cols-4 search-form">
  <input class="search-input" id="search-stops" #criteria (input)="search(criteria.value)" autocomplete="off" required />
  <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <label class="search-label" for="search-stops">Search Stops</label>
</section>

<ul class="cols-4">
  @if (error$ | async; as errors) {
    @for (anError of errors; track anError.msg) {
      <li>{{ anError.msg }}</li>
    }
  }
  @if (stops$ | async; as stops) {
    @for (stop of stops; track stop.stpid) {
      <li class="bus-stop">
        <a routerLink="/arrivals/{{ forRoute }}/{{ forDirection }}/{{ stop.stpid }}/{{ replaceSlash(stop.stpnm) }}">
          {{ stop.stpnm }}
        </a>
      </li>
    }
  }
</ul>
