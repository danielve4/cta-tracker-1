<h1 class="cols-4">Route {{ forRoute }}</h1>
<ul class="cols-4">
  @if (error$ | async; as errors) {
    @for (anError of errors; track anError.msg) {
      <li>{{ anError.msg }}</li>
    }
  }
  @if (directions$ | async; as directions) {
    @for (direction of directions; track direction.dir) {
      <li class="bus-direction">
        <a routerLink="/stops/{{ forRoute }}/{{ direction.dir }}">{{ direction.dir }}</a>
      </li>
    }
  }
</ul>
