@switch (prefs.alertStyle()) {
  @case ('card') { <app-alert-card [alerts]="alerts()" /> }
  @case ('capsule') { <app-alert-capsule [alerts]="alerts()" /> }
  @case ('margin-note') { <app-alert-margin-note [alerts]="alerts()" /> }
  @case ('counter') { <app-alert-counter [alerts]="alerts()" /> }
  @case ('toast') { <app-alert-toast [alerts]="alerts()" /> }
  @default { <app-alert-ticker [alerts]="alerts()" /> }
}
