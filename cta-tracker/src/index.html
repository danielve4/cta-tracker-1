  <meta name="theme-color" content="#000000">
  <style>html{background-color:#0a0a0c}html[data-theme=light]{background-color:#f4f4f8}</style>
  <script>
    (function() {
      var t = localStorage.getItem('theme-preference');
      if (!t || t === 'system') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
      if (t === 'light') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f5f7');
      }
    })();
  </script>
