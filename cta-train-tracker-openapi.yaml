x-appendix-c-direction-codes:
  description: >
    Train direction codes (trDr) by route. Represents the operational direction of a train,
    not necessarily the physical bearing. Value represents the direction as of prediction
    generation time, not upon reaching a given future stop.
  routes:
    - route: Red Line
      directions:
        - code: 1
          meaning: Howard-bound
        - code: 5
          meaning: 95th/Dan Ryan-bound
    - route: Blue Line
      directions:
        - code: 1
          meaning: O'Hare-bound
        - code: 5
          meaning: Forest Park-bound
    - route: Brown Line
      directions:
        - code: 1
          meaning: Kimball-bound
        - code: 5
          meaning: Loop-bound
    - route: Green Line
      directions:
        - code: 1
          meaning: Harlem/Lake-bound
        - code: 5
          meaning: Ashland/63rd- or Cottage Grove-bound (toward 63rd St destinations)
    - route: Orange Line
      directions:
        - code: 1
          meaning: Loop-bound
        - code: 5
          meaning: Midway-bound
    - route: Purple Line
      directions:
        - code: 1
          meaning: Linden-bound
        - code: 5
          meaning: Howard- or Loop-bound
    - route: Pink Line
      directions:
        - code: 1
          meaning: Loop-bound
        - code: 5
          meaning: 54th/Cermak-bound
    - route: Yellow Line
      directions:
        - code: 1
          meaning: Skokie-bound
        - code: 5
          meaning: Howard-bound

x-appendix-e-error-codes:
  description: >
    Error codes are returned in the errCd field of all responses.
    A value of 0 indicates success. All other values indicate an error condition.
  arrivals-api:
    - code: 0
      name: OK
      description: No error.
    - code: 100
      name: Required parameter missing
      description: >
        The query string does not contain one of the required parameters.
        Currently required parameters are mapid or stpid, and key.
    - code: 101
      name: Invalid API key
      description: The value for the required parameter key is not a valid API key.
    - code: 102
      name: Maximum daily usage exceeded
      description: >
        The number of successful API requests using the supplied key have exceeded
        the maximum daily value (default 100,000).
    - code: 103
      name: Invalid mapid
      description: >
        At least one of the supplied values for the mapid parameter is not valid.
        The first invalid id is returned in the error message.
    - code: 104
      name: Non-integer mapid
      description: >
        At least one of the supplied values for the mapid parameter is not an integer.
        The first invalid id is returned in the error message.
    - code: 105
      name: Too many mapids
      description: >
        A maximum of 4 values may be specified for the mapid parameter.
        More than 4 were supplied.
    - code: 106
      name: Invalid route identifier
      description: >
        At least one of the supplied values for the rt parameter is invalid.
        Supported values are Red, Blue, Brn, G, Org, P, Pink, Y.
    - code: 107
      name: Too many routes
      description: >
        A maximum of 4 values may be specified for the rt parameter.
        More than 4 were supplied.
    - code: 108
      name: Invalid stpid
      description: >
        At least one of the supplied values for the stpid parameter is invalid.
        The first invalid value is returned in the error message.
    - code: 109
      name: Too many stpids
      description: >
        A maximum of 4 values may be specified for the stpid parameter.
        More than 4 were supplied.
    - code: 110
      name: Invalid max value
      description: A non-integer value was specified for the max parameter.
    - code: 111
      name: Non-positive max value
      description: >
        A value less than 1 was specified for the max parameter.
        The value must be a positive integer greater than zero.
    - code: 112
      name: Non-integer stpid
      description: >
        At least one of the supplied values for the stpid parameter is not an integer.
        The first invalid id is returned in the error message.
    - code: 500
      name: Invalid parameter
      description: >
        The query string contains a parameter not supported by the API.
        Supported parameters are mapid, key, rt, stpid, max.
    - code: 900
      name: Server error
      description: A server error occurred.
  follow-train-api:
    - code: 100
      name: Required parameter missing
      description: >
        One or more required parameters are missing.
        Required parameters for this API are runnumber and key.
    - code: 101
      name: Invalid API key
      description: The supplied API key was not a valid API key.
    - code: 102
      name: Maximum daily usage exceeded
      description: The daily usage limit for the supplied key has been exceeded.
    - code: 500
      name: Invalid parameter
      description: >
        The query string contains an invalid parameter.
        Valid parameters for this API are runnumber and key.
    - code: 501
      name: Run number not found
      description: >
        No trains with the given run number were found.
        The train may have left service or the run number may be incorrect.
    - code: 502
      name: Unable to determine upcoming stops
      description: >
        The indicated train has an unexpected exit station ID and the system cannot
        reliably determine which predictions to report.
    - code: 503
      name: Unable to find predictions
      description: >
        The train exists but none of the available predictions are for active stations.
  locations-api:
    - code: 100
      name: Required parameter missing
      description: >
        One of the required parameters (rt, key) was not provided.
    - code: 101
      name: Invalid API key
      description: The API key given in the key parameter was either not found or inactive.
    - code: 102
      name: Maximum daily usage exceeded
      description: Key usage has exceeded daily limits. Limits are reset at midnight.
    - code: 106
      name: Invalid route identifier
      description: >
        The route identifier provided in the rt parameter is not valid.
        Valid route identifiers are red, blue, brn, g, org, p, pink, y.
    - code: 107
      name: Too many routes
      description: >
        No more than 8 routes can be issued per request.
        Duplicate values count toward the limit but are not returned.
    - code: 500
      name: Invalid parameter
      description: >
        The indicated parameter is not valid.
        Valid parameters are rt and key.
