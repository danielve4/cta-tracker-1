openapi: 3.0.3
info:
  title: CTA Train Tracker API
  description: >
    The CTA Train Tracker API provides real-time arrival predictions, train location data, and
    follow-a-train functionality for the Chicago Transit Authority 'L' rapid transit system.

    Information in CTA Train Tracker comes from data fed to CTA from its rail infrastructure.
    Unlike buses, the CTA rail fleet does not have GPS hardware — position data is derived from
    track circuit occupancy. Predictions are generated by the QuicTrak® system (a registered
    trademark of QEI, Inc.) and are updated as trains move from one section of track to another,
    with estimated arrivals available up to 60 minutes ahead.

    **Important behavioral notes:**
    - Predictions are generated for locations where trains pick up passengers. Terminal arrivals
      and exit-only platforms are not included.
    - When no live prediction is available (e.g., no train has departed a terminal), up to one
      scheduled departure time may be returned in lieu of a live prediction. Schedule-based entries
      will have empty `lat`, `lon`, and `heading` fields.
    - Terminal departures are always shown as scheduled departures; live information is not
      available until a train leaves the terminal.
    - Internal testing has shown train arrival accuracy averages less than ±1 minute from
      prediction times.

    **Authentication:** All requests require a valid API key passed via the `key` query parameter.
    Register at transitchicago.com/developers to receive a key.

    **Response Format:** XML is the default. Pass `outputType=JSON` to receive JSON responses.
    This spec documents the JSON format only.

    **Tip:** Use the CTA Customer Alerts API alongside this API. Alerts contain a special
    `ttim` flag that indicates when an event is affecting Train Tracker prediction quality.

    **Legal:** By using this API, you agree to the CTA Developer License Agreement and Terms of Use.
    This service is provided on an as-is basis without guarantees as to availability or accuracy.
  version: "1.46"
  contact:
    name: Chicago Transit Authority
    url: https://www.transitchicago.com/developers
    email: webmaster@transitchicago.com
  license:
    name: CTA Developer License Agreement and Terms of Use
    url: https://www.transitchicago.com/developers/terms

servers:
  - url: http://lapi.transitchicago.com/api/1.0
    description: CTA Train Tracker API (Live)

tags:
  - name: Arrivals
    description: >
      Arrival and departure predictions for all platforms at a given train station or stop.
  - name: Follow Train
    description: >
      Follow a specific train run by run number and get all its upcoming arrival predictions
      up to 60 minutes ahead or to the end of its trip.
  - name: Locations
    description: >
      Real-time locations of all in-service trains for one or more 'L' routes.

paths:

  # ─────────────────────────────────────────────
  # ARRIVALS API
  # ─────────────────────────────────────────────
  /ttarrivals.aspx:
    get:
      operationId: getArrivals
      summary: Get arrival predictions for a station or stop
      description: >
        Returns a list of arrival predictions for all platforms at a given train station or
        specific platform stop. Each prediction represents a single train and includes the
        expected arrival time, route, destination, and train attributes.

        You must specify either `mapid` (parent station) or `stpid` (specific platform/stop),
        but not both. A maximum of 4 values can be supplied for `mapid` and a maximum of 4 for `stpid`.

        **Station vs. Stop IDs:**
        - `mapid` accepts a 5-digit parent station ID in the **4xxxx** range. Use this to get
          predictions for all platforms at a station.
        - `stpid` accepts a 5-digit individual stop ID in the **3xxxx** range. Use this for a
          specific platform or direction at a station.

        **Destination notes:**
        - `destSt` is experimental/supplemental and is only available once a train has departed.
          Schedule-based predictions show `0` for this field.
        - `destNm` is the public-facing friendly name that matches the train's destination sign.
          It may change as the train progresses (e.g., a Loop-bound Orange Line train becomes
          "Midway"-labeled once it passes Harold Washington Library–State/Van Buren).

        **Lat/lon/heading:** Only available for in-service trains that have left their terminals.
        Schedule-based predictions (`isSch=1`) will have empty values for these fields.

        **Calculating minutes to arrival:** Subtract `prdt` from `arrT`. This gives the number
        of minutes calculated from when the train last moved into a new track circuit.
        Consider displaying "Due" or "Approaching" when the value of `isApp` is `1`.
      tags:
        - Arrivals
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/outputType'
        - name: mapid
          in: query
          required: false
          description: >
            A five-digit parent station ID (in the **4xxxx** range) identifying which station
            to receive predictions for. Required if `stpid` is not specified. Up to 4 values
            may be supplied as a comma-delimited list.
            See Appendix B for a full list of valid station IDs.
          schema:
            type: string
            example: "40380"
        - name: stpid
          in: query
          required: false
          description: >
            A five-digit individual stop ID (in the **3xxxx** range) identifying a specific
            platform or platform side within a station. Required if `mapid` is not specified.
            Up to 4 values may be supplied as a comma-delimited list.
            See Appendix B for a full list of valid stop IDs.
          schema:
            type: string
            example: "30071"
        - name: max
          in: query
          required: false
          description: >
            The maximum number of predictions to return. Must be a positive integer.
            If not specified, all available results for the requested stop or station are returned.
          schema:
            type: integer
            minimum: 1
            example: 5
        - name: rt
          in: query
          required: false
          description: >
            A single route code to filter results to a specific route. If not specified,
            all available results for the requested stop or station are returned.
            Valid values are: `Red`, `Blue`, `Brn`, `G`, `Org`, `P`, `Pink`, `Y`.
          schema:
            type: string
            enum: [Red, Blue, Brn, G, Org, P, Pink, Y]
            example: "Brn"
      responses:
        '200':
          description: >
            Successful response containing arrival predictions. Check `errCd` in the response
            body to confirm successful processing (`errCd` of `"0"` means no error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrivalsResponse'
              examples:
                arrivals_by_mapid:
                  summary: One arrival prediction for station 40360 (Southport, Brown Line)
                  value:
                    ctatt:
                      tmst: "2015-04-30T20:23:53"
                      errCd: "0"
                      errNm: null
                      eta:
                        - staId: "40960"
                          stpId: "30185"
                          staNm: "Pulaski"
                          stpDe: "Service toward Loop"
                          rn: "726"
                          rt: "Org"
                          destSt: "30182"
                          destNm: "Loop"
                          trDr: "1"
                          prdt: "2015-04-30T20:23:32"
                          arrT: "2015-04-30T20:25:32"
                          isApp: "0"
                          isSch: "0"
                          isDly: "0"
                          isFlt: "0"
                          flags: null
                          lat: "41.78661"
                          lon: "-87.73796"
                          heading: "357"
                error_response:
                  summary: Error — invalid API key
                  value:
                    ctatt:
                      tmst: "2015-04-30T20:23:53"
                      errCd: "101"
                      errNm: "Invalid API key"
                      eta: []
        '400':
          description: Bad request — check error codes in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrivalsResponse'

  # ─────────────────────────────────────────────
  # FOLLOW THIS TRAIN API
  # ─────────────────────────────────────────────
  /ttfollow.aspx:
    get:
      operationId: followTrain
      summary: Get upcoming arrivals for a specific train run
      description: >
        Returns a list of arrival predictions for a given train run number at all subsequent
        stations the train is estimated to reach, up to 60 minutes in the future or to the
        end of its trip.

        This is useful for following a specific train as it progresses along its route and
        tracking all upcoming stops it will make.

        In addition to the `eta` array (one entry per upcoming stop), the response includes
        a `position` object with the train's current real-time coordinates and heading.

        **Note:** This API does not return schedule-based (`isSch`) predictions — all results
        are live. The `lat`, `lon`, and `heading` fields are available in the `position` object
        rather than per-prediction (unlike the Arrivals API).

        **Destination notes:**
        - `destSt` is experimental/supplemental and is only available once a train has departed.
        - `destNm` is the public-facing friendly name matching the train's destination sign.

        **Calculating minutes to arrival:** Subtract `prdt` from `arrT` for each `eta` entry.
        Display "Due" or "Approaching" when `isApp` equals `"1"`.
      tags:
        - Follow Train
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/outputType'
        - name: runnumber
          in: query
          required: true
          description: >
            The run number of the train for which upcoming arrival predictions are requested.
            Run numbers are assigned to individual trains in service and can be obtained from
            the Arrivals API or Locations API response (`rn` field).
          schema:
            type: integer
            example: 830
      responses:
        '200':
          description: >
            Successful response containing the train's current position and upcoming arrival
            predictions. Check `errCd` to confirm successful processing (`"0"` means no error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowTrainResponse'
              examples:
                follow_run_830:
                  summary: Upcoming arrivals for run 830 (Red Line approaching Howard)
                  value:
                    ctatt:
                      tmst: "2015-04-30T20:28:37"
                      errCd: "0"
                      errNm: null
                      position:
                        lat: "42.01588"
                        lon: "-87.66909"
                        heading: "310"
                      eta:
                        - staId: "40900"
                          stpId: "30173"
                          staNm: "Howard"
                          stpDe: "Howard (Red Line Terminal Arrival)"
                          rn: "830"
                          rt: "Red Line"
                          destSt: "30173"
                          destNm: "Howard"
                          trDr: "1"
                          prdt: "2015-04-30T20:27:58"
                          arrT: "2015-04-30T20:28:58"
                          isApp: "1"
                          isSch: "0"
                          isDly: "0"
                          isFlt: "0"
                          flags: null
                follow_run_123:
                  summary: Upcoming arrivals for run 123 (Blue Line approaching Austin and Cicero)
                  value:
                    ctatt:
                      tmst: "2013-05-15T14:11:17"
                      errCd: "0"
                      errNm: null
                      position:
                        lat: "41.97776"
                        lon: "-87.77567"
                        heading: "299"
                      eta:
                        - staId: "40010"
                          stpId: "30001"
                          staNm: "Austin"
                          stpDe: "Austin to O'Hare"
                          rn: "123"
                          rt: "Blue Line"
                          destSt: "30171"
                          destNm: "O'Hare"
                          trDr: "1"
                          prdt: "2013-05-15T14:10:23"
                          arrT: "2013-05-15T14:11:23"
                          isApp: "1"
                          isSch: "0"
                          isDly: "0"
                          isFlt: "0"
                          flags: null
                        - staId: "40970"
                          stpId: "30187"
                          staNm: "Cicero"
                          stpDe: "Cicero to O'Hare"
                          rn: "123"
                          rt: "Blue Line"
                          destSt: "30171"
                          destNm: "O'Hare"
                          trDr: "1"
                          prdt: "2013-05-15T14:10:23"
                          arrT: "2013-05-15T14:15:23"
                          isApp: "0"
                          isSch: "0"
                          isDly: "0"
                          isFlt: "0"
                          flags: null
        '400':
          description: Bad request — check error codes in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowTrainResponse'

  # ─────────────────────────────────────────────
  # LOCATIONS API
  # ─────────────────────────────────────────────
  /ttpositions.aspx:
    get:
      operationId: getTrainLocations
      summary: Get real-time locations of all in-service trains for one or more routes
      description: >
        Returns a list of all in-service trains and their real-time locations for one or
        more specified 'L' routes. Each entry describes a single train with coordinates,
        geospatial heading, key train attributes, and next stop information.

        Multiple routes can be specified as a comma-delimited list using the `rt` parameter.
        Up to 8 route identifiers can be included in a single request. Duplicate route
        identifiers count toward the limit but are not returned in duplicate.

        **Route identifiers** (case-insensitive): `red`, `blue`, `brn`, `g`, `org`, `p`, `pink`, `y`

        The JSON response wraps trains by route in a `route` array. Each route object includes
        a `@name` attribute indicating the route identifier, and a `train` array of all
        in-service trains on that route.

        **Destination notes:**
        - `destSt` is experimental/supplemental and refers to the train's ultimate GTFS stop ID.
        - `destNm` is the public-facing friendly name matching the train's destination sign.

        **Next stop info:** `nextStaId`, `nextStpId`, and `nextStaNm` describe the next station
        and stop the train is predicted to reach. `prdt` and `arrT` reflect the predicted
        arrival time at that next stop.
      tags:
        - Locations
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/outputType'
        - name: rt
          in: query
          required: true
          description: >
            Comma-delimited list of route identifiers for which train location data is requested.
            Up to 8 routes can be specified per request. Duplicate values count toward the limit
            but are not returned in duplicate.

            Valid values: `red`, `blue`, `brn`, `g`, `org`, `p`, `pink`, `y`.
          schema:
            type: string
            example: "red,blue"
      responses:
        '200':
          description: >
            Successful response containing real-time train location data grouped by route.
            Check `errCd` to confirm successful processing (`"0"` means no error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsResponse'
              examples:
                red_line_locations:
                  summary: In-service Red Line trains with current location and next stop
                  value:
                    ctatt:
                      tmst: "2015-04-30T20:29:44"
                      errCd: "0"
                      errNm: null
                      route:
                        - "@name": "red"
                          train:
                            - rn: "827"
                              destSt: "30173"
                              destNm: "Howard"
                              trDr: "1"
                              nextStaId: "40650"
                              nextStpId: "30125"
                              nextStaNm: "North/Clybourn"
                              prdt: "2015-04-30T20:29:24"
                              arrT: "2015-04-30T20:31:24"
                              isApp: "0"
                              isDly: "0"
                              flags: null
                              lat: "41.90383"
                              lon: "-87.63685"
                              heading: "269"
                multi_route_locations:
                  summary: Multiple in-service Red Line trains (from XML-equivalent example)
                  value:
                    ctatt:
                      tmst: "2013-06-10T15:00:21"
                      errCd: "0"
                      errNm: null
                      route:
                        - "@name": "red"
                          train:
                            - rn: "804"
                              destSt: "30173"
                              destNm: "Howard"
                              trDr: "1"
                              nextStaId: "41400"
                              nextStpId: "30269"
                              nextStaNm: "Roosevelt"
                              prdt: "2013-06-10T14:58:48"
                              arrT: "2013-06-10T14:59:48"
                              isApp: "1"
                              isDly: "0"
                              flags: null
                              lat: "41.86579"
                              lon: "-87.62736"
                              heading: "358"
                            - rn: "808"
                              destSt: "30173"
                              destNm: "Howard"
                              trDr: "1"
                              nextStaId: "40510"
                              nextStpId: "30099"
                              nextStaNm: "Garfield"
                              prdt: "2013-06-10T14:58:03"
                              arrT: "2013-06-10T15:00:03"
                              isApp: "0"
                              isDly: "0"
                              flags: null
                              lat: "41.78697"
                              lon: "-87.6187"
                              heading: "81"
        '400':
          description: Bad request — check error codes in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsResponse'

# ═══════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════
components:

  # ─────────────────────────────────────────────
  # PARAMETERS (shared)
  # ─────────────────────────────────────────────
  parameters:
    key:
      name: key
      in: query
      required: true
      description: >
        Your unique alphanumeric API key, assigned after agreeing to the CTA Developer
        License Agreement and requesting a key at transitchicago.com/developers.
      schema:
        type: string
        example: "a8456djbhf8475683jf7818bha81"

    outputType:
      name: outputType
      in: query
      required: false
      description: >
        If set to `JSON`, the API response will be formatted as JSON instead of the default XML.
        This spec documents the JSON format only.
      schema:
        type: string
        enum: [JSON]
        example: "JSON"

  # ─────────────────────────────────────────────
  # SCHEMAS
  # ─────────────────────────────────────────────
  schemas:

    # ── SHARED: ARRIVAL/ETA PREDICTION ──
    EtaPrediction:
      type: object
      description: >
        A single arrival or departure prediction for one train at one platform.
        This schema is shared between the Arrivals API and the Follow This Train API.
      required:
        - staId
        - stpId
        - staNm
        - stpDe
        - rn
        - rt
        - destSt
        - destNm
        - trDr
        - prdt
        - arrT
        - isApp
        - isSch
        - isDly
        - isFlt
      properties:
        staId:
          type: string
          description: >
            Numeric GTFS parent station ID for which this prediction is for.
            Five digits in the **4xxxx** range. Matches the `mapid` specified by the requestor.
          example: "40960"
        stpId:
          type: string
          description: >
            Numeric GTFS unique stop ID within the station for which this prediction is for.
            Five digits in the **3xxxx** range. Represents a specific platform or direction.
          example: "30185"
        staNm:
          type: string
          description: The proper textual name of the parent station.
          example: "Pulaski"
        stpDe:
          type: string
          description: >
            Textual description of the platform for which this prediction applies.
            Typically describes direction of service (e.g., "Service toward Loop").
          example: "Service toward Loop"
        rn:
          type: string
          description: Run number of the train being predicted for.
          example: "726"
        rt:
          type: string
          description: >
            Textual abbreviated route name of the train being predicted for.
            Matches GTFS route identifiers.
            Valid values: `Red`, `Blue`, `Brn`, `G`, `Org`, `P`, `Pink`, `Y`.
          enum: [Red, Blue, Brn, G, Org, P, Pink, Y, "Red Line", "Blue Line"]
          example: "Org"
        destSt:
          type: string
          description: >
            GTFS unique stop ID where this train is expected to ultimately end its service run.
            Experimental and supplemental only — only available once a train has departed.
            Returns `"0"` for schedule-based predictions (`isSch="1"`).
            Does not necessarily match the destination sign on the train (particularly on
            routes that operate around the whole Loop).
          example: "30182"
        destNm:
          type: string
          description: >
            Friendly, public-facing destination description. This is the value that should
            match the destination sign on approaching trains and is the recommended field
            to display to end users.
            May change as the train progresses through its route — for example, a Loop-bound
            Orange Line train becomes labeled "Midway" once it passes Harold Washington
            Library–State/Van Buren.
          example: "Loop"
        trDr:
          type: string
          description: >
            Numeric train route direction code representing the train's current operational
            direction. This is not necessarily the physical direction of the train at its
            current location but rather the big-picture route direction as of prediction time.

            Direction codes by route:
            - **Red Line:** `1` = Howard-bound, `5` = 95th/Dan Ryan-bound
            - **Blue Line:** `1` = O'Hare-bound, `5` = Forest Park-bound
            - **Brown Line:** `1` = Kimball-bound, `5` = Loop-bound
            - **Green Line:** `1` = Harlem/Lake-bound, `5` = Ashland/63rd- or Cottage Grove-bound
            - **Orange Line:** `1` = Loop-bound, `5` = Midway-bound
            - **Purple Line:** `1` = Linden-bound, `5` = Howard- or Loop-bound
            - **Pink Line:** `1` = Loop-bound, `5` = 54th/Cermak-bound
            - **Yellow Line:** `1` = Skokie-bound, `5` = Howard-bound
          enum: ["1", "5"]
          example: "1"
        prdt:
          type: string
          format: date-time
          description: >
            Date-time stamp for when this prediction was generated.
            Format in JSON responses: ISO 8601 (`yyyy-MM-ddTHH:mm:ss`), time local to Chicago.
          example: "2015-04-30T20:23:32"
        arrT:
          type: string
          format: date-time
          description: >
            Date-time stamp for when the train is expected to arrive or depart at this stop.
            Format in JSON responses: ISO 8601 (`yyyy-MM-ddTHH:mm:ss`), time local to Chicago.

            **To calculate minutes until arrival:** subtract `prdt` from `arrT`. This gives
            the number of minutes calculated from when the train last moved into a new track
            circuit. Note that `arrT` output is a minimum of 60 seconds from most recent
            prediction generation — trains disappear from results once they actually arrive.
          example: "2015-04-30T20:25:32"
        isApp:
          type: string
          description: >
            Indicates that Train Tracker is now declaring "Approaching" or "Due" for this train.
            - `"1"` = Approaching/Due (recommend displaying "Due" or "Approaching" to users)
            - `"0"` = Not yet approaching
          enum: ["0", "1"]
          example: "0"
        isSch:
          type: string
          description: >
            Boolean flag indicating whether this is a live prediction or a schedule-based
            prediction in lieu of live data.
            - `"1"` = Schedule-based (no live train data available; `lat`, `lon`, and `heading`
              will be empty)
            - `"0"` = Live prediction
          enum: ["0", "1"]
          example: "0"
        isDly:
          type: string
          description: >
            Boolean flag indicating whether the train is considered "delayed" in Train Tracker.
            A train is considered delayed when it has not moved from one track circuit to another
            for an abnormally long period of time.
            - `"1"` = Delayed (recommend indicating delay to users rather than showing stale prediction)
            - `"0"` = Not delayed
          enum: ["0", "1"]
          example: "0"
        isFlt:
          type: string
          description: >
            Boolean flag indicating whether a potential schedule fault has been detected.
            A fault on a schedule-based ETA (`isSch="1"`) means the scheduled arrival time
            may not be feasible because a scheduled departure has not yet occurred. Our system
            calculates whether a scheduled arrival is feasible based on minimum travel times
            from a terminal.
            This does not necessarily mean delays or poor service — it only means a train
            did not leave exactly when the schedule provisioned.
            - `"1"` = Potential fault detected
            - `"0"` = No fault
          enum: ["0", "1"]
          example: "0"
        flags:
          type: string
          nullable: true
          description: >
            Train flags. Not presently in use. Returns `null` in JSON responses.
          example: null
        lat:
          type: string
          description: >
            Latitude position of the train in decimal degrees.
            Only available for in-service trains that have left their terminals.
            Empty string for schedule-based predictions (`isSch="1"`).
          example: "41.78661"
        lon:
          type: string
          description: >
            Longitude position of the train in decimal degrees.
            Only available for in-service trains that have left their terminals.
            Empty string for schedule-based predictions (`isSch="1"`).
          example: "-87.73796"
        heading:
          type: string
          description: >
            Heading of the train expressed in standard bearing degrees.
            - `0` = North
            - `90` = East
            - `180` = South
            - `270` = West
            Range is 0 to 359, progressing clockwise.
            Only available for in-service trains that have left their terminals.
            Empty string for schedule-based predictions (`isSch="1"`).
          example: "357"

    # ── ARRIVALS: ROOT RESPONSE ──
    ArrivalsResponse:
      type: object
      description: Root response wrapper for the Arrivals API (ttarrivals.aspx).
      properties:
        ctatt:
          type: object
          description: Root element of the response document.
          required:
            - tmst
            - errCd
            - errNm
          properties:
            tmst:
              type: string
              format: date-time
              description: >
                Date and time when this response was generated.
                Format in JSON: ISO 8601 (`yyyy-MM-ddTHH:mm:ss`), time local to Chicago.
              example: "2015-04-30T20:23:53"
            errCd:
              type: string
              description: >
                Numeric error code. A value of `"0"` indicates no error.
                See Arrivals API Error Codes for all possible values.
              example: "0"
            errNm:
              type: string
              nullable: true
              description: >
                Textual error description or message. `null` when no error occurred.
              example: null
            eta:
              type: array
              description: >
                Array of arrival/departure predictions. One object per individual prediction.
                May be empty if no predictions are available or an error occurred.
              items:
                $ref: '#/components/schemas/EtaPrediction'

    # ── FOLLOW TRAIN: POSITION ──
    TrainPosition:
      type: object
      description: >
        Current real-time position of the train being followed. One object per response.
      required:
        - lat
        - lon
        - heading
      properties:
        lat:
          type: string
          description: Latitude position of the train in decimal degrees.
          example: "42.01588"
        lon:
          type: string
          description: Longitude position of the train in decimal degrees.
          example: "-87.66909"
        heading:
          type: string
          description: >
            Heading of the train expressed in standard bearing degrees.
            - `0` = North
            - `90` = East
            - `180` = South
            - `270` = West
            Range is 0 to 359, progressing clockwise.
          example: "310"

    # ── FOLLOW TRAIN: ROOT RESPONSE ──
    FollowTrainResponse:
      type: object
      description: Root response wrapper for the Follow This Train API (ttfollow.aspx).
      properties:
        ctatt:
          type: object
          description: Root element of the response document.
          required:
            - tmst
            - errCd
            - errNm
          properties:
            tmst:
              type: string
              format: date-time
              description: >
                Date and time when this response was generated.
                Format in JSON: ISO 8601 (`yyyy-MM-ddTHH:mm:ss`), time local to Chicago.
              example: "2015-04-30T20:28:37"
            errCd:
              type: string
              description: >
                Numeric error code. A value of `"0"` indicates no error.
                See Follow Train API Error Codes for all possible values.
              example: "0"
            errNm:
              type: string
              nullable: true
              description: >
                Textual error description or message. `null` when no error occurred.
              example: null
            position:
              $ref: '#/components/schemas/TrainPosition'
              description: >
                Current real-time coordinates and heading of the followed train.
            eta:
              type: array
              description: >
                Array of upcoming arrival predictions for the followed train at all subsequent
                stations, up to 60 minutes ahead or to the end of its trip. Ordered chronologically.
                Note: `lat`, `lon`, and `heading` fields within each `eta` object are not
                present in the Follow Train API response (position is provided in the top-level
                `position` object instead).
              items:
                $ref: '#/components/schemas/EtaPrediction'

    # ── LOCATIONS: INDIVIDUAL TRAIN ──
    TrainLocation:
      type: object
      description: >
        Real-time location and next stop information for a single in-service train.
      required:
        - rn
        - destSt
        - destNm
        - trDr
        - nextStaId
        - nextStpId
        - nextStaNm
        - prdt
        - arrT
        - isApp
        - isDly
        - lat
        - lon
        - heading
      properties:
        rn:
          type: string
          description: Run number of the train.
          example: "827"
        destSt:
          type: string
          description: >
            GTFS unique stop ID where this train is expected to ultimately end its service run.
            Experimental and supplemental only. Does not necessarily match the train's destination sign.
          example: "30173"
        destNm:
          type: string
          description: >
            Friendly, public-facing destination description matching the train's destination sign.
            This is the recommended field to display to end users.
          example: "Howard"
        trDr:
          type: string
          description: >
            Numeric train route direction code representing the train's current operational direction.

            Direction codes by route:
            - **Red Line:** `1` = Howard-bound, `5` = 95th/Dan Ryan-bound
            - **Blue Line:** `1` = O'Hare-bound, `5` = Forest Park-bound
            - **Brown Line:** `1` = Kimball-bound, `5` = Loop-bound
            - **Green Line:** `1` = Harlem/Lake-bound, `5` = Ashland/63rd- or Cottage Grove-bound
            - **Orange Line:** `1` = Loop-bound, `5` = Midway-bound
            - **Purple Line:** `1` = Linden-bound, `5` = Howard- or Loop-bound
            - **Pink Line:** `1` = Loop-bound, `5` = 54th/Cermak-bound
            - **Yellow Line:** `1` = Skokie-bound, `5` = Howard-bound
          enum: ["1", "5"]
          example: "1"
        nextStaId:
          type: string
          description: >
            Next station ID (parent station ID in the **4xxxx** range, matching GTFS).
          example: "40650"
        nextStpId:
          type: string
          description: >
            Next stop ID (individual stop ID in the **3xxxx** range, matching GTFS).
          example: "30125"
        nextStaNm:
          type: string
          description: Proper name of the next station.
          example: "North/Clybourn"
        prdt:
          type: string
          format: date-time
          description: >
            Date-time stamp for when the prediction for the next stop was generated.
            Format in JSON: ISO 8601 (`yyyy-MM-ddTHH:mm:ss`), time local to Chicago.
          example: "2015-04-30T20:29:24"
        arrT:
          type: string
          format: date-time
          description: >
            Date-time stamp for when the train is expected to arrive at the next stop.
            Format in JSON: ISO 8601 (`yyyy-MM-ddTHH:mm:ss`), time local to Chicago.
            Subtract `prdt` from `arrT` to calculate minutes until next arrival.
          example: "2015-04-30T20:31:24"
        isApp:
          type: string
          description: >
            Indicates that Train Tracker is declaring "Approaching" or "Due" for this train
            at its next stop.
            - `"1"` = Approaching/Due
            - `"0"` = Not yet approaching
          enum: ["0", "1"]
          example: "0"
        isDly:
          type: string
          description: >
            Boolean flag indicating whether this train is considered delayed.
            A train is considered delayed when it has not moved from one track circuit
            to another for an abnormally long period of time.
            - `"1"` = Delayed
            - `"0"` = Not delayed
          enum: ["0", "1"]
          example: "0"
        flags:
          type: string
          nullable: true
          description: >
            Train flags. Not presently in use. Returns `null` in JSON responses.
          example: null
        lat:
          type: string
          description: Latitude position of the train in decimal degrees.
          example: "41.90383"
        lon:
          type: string
          description: Longitude position of the train in decimal degrees.
          example: "-87.63685"
        heading:
          type: string
          description: >
            Heading of the train expressed in standard bearing degrees.
            - `0` = North
            - `90` = East
            - `180` = South
            - `270` = West
            Range is 0 to 359, progressing clockwise.
          example: "269"

    # ── LOCATIONS: ROUTE CONTAINER ──
    RouteTrains:
      type: object
      description: >
        Container grouping all in-service trains for a single 'L' route.
        In the JSON response, the route name is provided via the `@name` attribute.
      required:
        - "@name"
        - train
      properties:
        "@name":
          type: string
          description: >
            Route identifier indicating which route this group of trains belongs to.
            Matches GTFS route identifiers (lowercase).
            Valid values: `red`, `blue`, `brn`, `g`, `org`, `p`, `pink`, `y`.
          enum: [red, blue, brn, g, org, p, pink, y]
          example: "red"
        train:
          type: array
          description: Array of in-service train objects for this route.
          items:
            $ref: '#/components/schemas/TrainLocation'

    # ── LOCATIONS: ROOT RESPONSE ──
    LocationsResponse:
      type: object
      description: Root response wrapper for the Locations API (ttpositions.aspx).
      properties:
        ctatt:
          type: object
          description: Root element of the response document.
          required:
            - tmst
            - errCd
            - errNm
          properties:
            tmst:
              type: string
              format: date-time
              description: >
                Date and time when this response was generated.
                Format in JSON: ISO 8601 (`yyyy-MM-ddTHH:mm:ss`), time local to Chicago.
              example: "2015-04-30T20:29:44"
            errCd:
              type: string
              description: >
                Numeric error code. A value of `"0"` indicates no error.
                See Train Locations API Error Codes for all possible values.
              example: "0"
            errNm:
              type: string
              nullable: true
              description: >
                Textual error description or message. `null` when no error occurred.
              example: null
            route:
              type: array
              description: >
                Array of route containers, one per route requested. Each entry includes the
                route identifier (`@name`) and a `train` array of all in-service trains
                on that route.
              items:
                $ref: '#/components/schemas/RouteTrains'

