openapi: 3.0.3
info:
  title: CTA Bus Tracker API
  description: >
    The Bus Tracker API allows for querying data from the CTA Bus Tracker service.
    The system can provide estimated arrival times for buses as they approach bus stops,
    as well as data on routes, stops, patterns, detours, cancelations and more.
    Information about buses and their estimated arrivals is updated about once every 30 seconds.

    **Authentication:** All requests require a valid 25-digit API key passed via the `key` query parameter.

    **Response Format:** XML is the default. Pass `format=json` to receive JSON responses.
    This spec documents the JSON format only.

    **Rate Limiting:** By default, one API key can make a maximum of 100,000 requests per day.

    **Versioning:** This document covers Version 3 only. The version is embedded in the URL path as `/v3/`.

    **Legal:** By using this API, you agree to the CTA Developer Terms of Use.
    This service is provided on an as-is basis without guarantees as to availability or accuracy.
  version: "3.0"
  contact:
    name: Chicago Transit Authority
    url: https://www.transitchicago.com
  license:
    name: CTA Developer Terms of Use
    url: https://www.transitchicago.com/developers/terms

servers:
  - url: https://www.ctabustracker.com/bustime/api/v3
    description: CTA Bus Tracker API v3 (port 80)

tags:
  - name: System
    description: System-level operations such as retrieving the current time.
  - name: Vehicles
    description: Real-time vehicle location data.
  - name: Routes
    description: Route listings and direction information.
  - name: Stops
    description: Stop listings for routes and directions.
  - name: Patterns
    description: Geo-positional patterns (route variations) for vehicles.
  - name: Predictions
    description: Estimated arrival and departure predictions for stops and vehicles.
  - name: Locales
    description: Available languages/locales for localized API responses.
  - name: Detours
    description: Active detour metadata and pattern changes.
  - name: Enhanced Detours
    description: Detailed detour data for GTFS-RT systems, including polyline and trip-level info.

paths:

  # ─────────────────────────────────────────────
  # GET TIME
  # ─────────────────────────────────────────────
  /gettime:
    get:
      operationId: getTime
      summary: Get current system time
      description: >
        Retrieve the current BusTime system date and time. Since BusTime is a time-dependent system,
        it is important to synchronize your application with BusTime's system date and time.
        Time given is local time unless `unixTime=true` is specified.
      tags:
        - System
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/locale'
        - name: unixTime
          in: query
          required: false
          description: >
            If true, returns the number of milliseconds that have elapsed since
            00:00:00 Coordinated Universal Time (UTC), Thursday, 1 January 1970.
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Successful response containing the current system time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTimeResponse'
              examples:
                localTime:
                  summary: Local time response
                  value:
                    bustime-response:
                      tm: "20160308 14:11:54"
                unixTime:
                  summary: Unix epoch time response
                  value:
                    bustime-response:
                      tm: "1531860021189"
        '400':
          $ref: '#/components/responses/ErrorResponse'

  # ─────────────────────────────────────────────
  # GET VEHICLES
  # ─────────────────────────────────────────────
  /getvehicles:
    get:
      operationId: getVehicles
      summary: Get vehicle locations
      description: >
        Retrieve vehicle information (i.e., locations) of all or a subset of vehicles
        currently being tracked by BusTime.

        Use `vid` to retrieve information for one or more specific vehicles.
        Use `rt` to retrieve information for all vehicles on one or more routes.

        **Note:** `vid` and `rt` cannot be combined. If both are specified, only the first
        parameter encountered will be processed. A maximum of 10 identifiers can be specified
        for either parameter.
      tags:
        - Vehicles
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/locale'
        - name: vid
          in: query
          required: false
          description: >
            Comma-delimited list of vehicle IDs whose location should be returned.
            Example: `509,392,201,4367`. Maximum of 10 identifiers. Cannot be combined with `rt`.
          schema:
            type: string
            example: "509,392"
        - name: rt
          in: query
          required: false
          description: >
            Comma-delimited list of route designators for which matching vehicles should be returned.
            Example: `X3,4,20`. Maximum of 10 identifiers. Cannot be combined with `vid`.
          schema:
            type: string
            example: "20,X20"
        - name: tmres
          in: query
          required: false
          description: >
            Resolution of timestamps in the response.
            - `s` — timestamp resolution to the second (format: `YYYYMMDD HH:MM:SS`)
            - `m` — timestamp resolution to the minute (format: `YYYYMMDD HH:MM`, default)
          schema:
            type: string
            enum: [s, m]
            default: m
            example: "s"
      responses:
        '200':
          description: Successful response containing vehicle location data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehiclesResponse'
              examples:
                byVehicleId:
                  summary: Response for vehicles 1 and 2
                  value:
                    bustime-response:
                      vehicle:
                        - vid: "1"
                          tmstmp: "20200307 13:14"
                          lat: "37.54381"
                          lon: "-77.43878166666667"
                          hdg: "308"
                          pid: 1689
                          rt: "6"
                          des: "BROAD WILLOW LAWN"
                          pdist: 3481
                          dly: false
                          spd: 3
                          tatripid: "12"
                          tablockid: "6-05"
                          origtatripno: "ME_ME403_V1_AA"
                          zone: ""
                          mode: 1
                          psgld: "EMPTY"
                          stst: 47520
                          stsd: "2020-03-07"
                        - vid: "2"
                          tmstmp: "20200307 13:14"
                          lat: "37.55896532837857"
                          lon: "-77.48567781754004"
                          hdg: "294"
                          pid: 1559
                          rt: "16"
                          des: "GROVE BF"
                          pdist: 20156
                          dly: false
                          spd: 5
                          tatripid: "12"
                          tablockid: "16-02"
                          origtatripno: "ME_ME403_V1_AA"
                          zone: ""
                          mode: 1
                          psgld: "FULL"
                          stst: 46140
                          stsd: "2020-03-07"
        '400':
          $ref: '#/components/responses/ErrorResponse'

  # ─────────────────────────────────────────────
  # GET ROUTES
  # ─────────────────────────────────────────────
  /getroutes:
    get:
      operationId: getRoutes
      summary: Get all routes
      description: >
        Retrieve the set of routes serviced by the system.
        Returns route designators, names, colors, and display designators.
      tags:
        - Routes
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/locale'
      responses:
        '200':
          description: Successful response containing all available routes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRoutesResponse'
              examples:
                routes:
                  summary: Sample route list
                  value:
                    bustime-response:
                      routes:
                        - rt: "1"
                          rtnm: "Pontiac – Dhu Varren"
                          rtdd: "1"
                          rtclr: "#ffffff"
                        - rt: "2"
                          rtnm: "Pontiac - University"
                          rtdd: "1"
                          rtclr: "#dc78af"
        '400':
          $ref: '#/components/responses/ErrorResponse'

  # ─────────────────────────────────────────────
  # GET DIRECTIONS
  # ─────────────────────────────────────────────
  /getdirections:
    get:
      operationId: getDirections
      summary: Get directions for a route
      description: >
        Retrieve the set of directions serviced by the specified route.
        The returned `id` field is what must be passed as the `dir` parameter in
        subsequent calls such as `getstops`.

        **Note:** In v3, the Route Directions call always returns locale-specific data
        regardless of whether the system is single-feed or multi-feed.
      tags:
        - Routes
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/locale'
        - name: rt
          in: query
          required: true
          description: Alphanumeric designator of a route (e.g. `"20"` or `"X20"`) for which directions are to be returned.
          schema:
            type: string
            example: "20"
      responses:
        '200':
          description: Successful response containing the available directions for the specified route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDirectionsResponse'
              examples:
                route20Directions:
                  summary: Directions for Route 20
                  value:
                    bustime-response:
                      directions:
                        - id: "Eastbound"
                          name: "Eastbound"
                        - id: "Westbound"
                          name: "Westbound"
        '400':
          $ref: '#/components/responses/ErrorResponse'

  # ─────────────────────────────────────────────
  # GET STOPS
  # ─────────────────────────────────────────────
  /getstops:
    get:
      operationId: getStops
      summary: Get stops for a route/direction or by stop IDs
      description: >
        Retrieve the set of stops for the specified route and direction,
        or retrieve one or more specific stops by stop ID.

        A request must provide either a `rt` + `dir` pair OR up to 10 `stpid`s — not both.

        Stop lists are only available for a valid route/direction pair.
        A list of all stops serving a particular route regardless of direction cannot be requested.

        If a stop is affected by a detour, the detour's ID will appear in:
        - `dtradd` — if the stop was temporarily added to the pattern
        - `dtrrem` — if the stop has been detoured around (removed)

        Use `getdetours` to retrieve metadata about a referenced detour ID.
      tags:
        - Stops
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/locale'
        - name: rt
          in: query
          required: false
          description: >
            Alphanumeric designator of the route (e.g. `"20"` or `"X20"`) for which stops are to be returned.
            Required if `stpid` is not provided.
          schema:
            type: string
            example: "20"
        - name: dir
          in: query
          required: false
          description: >
            Direction of the route (e.g. `"Eastbound"`). Must match the direction `id`
            from the `getdirections` call. Required if `stpid` is not provided.
          schema:
            type: string
            example: "Eastbound"
        - name: stpid
          in: query
          required: false
          description: >
            Comma-delimited list of numeric stop IDs (e.g. `"305,1577,1564"`).
            Up to 10 stop IDs can be specified. Required if `rt` and `dir` are not provided.
          schema:
            type: string
            example: "1577,1564"
      responses:
        '200':
          description: Successful response containing stop data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStopsResponse'
              examples:
                stopsByRouteDir:
                  summary: Stops for Route 20 Eastbound
                  value:
                    bustime-response:
                      stops:
                        - stpid: "1577"
                          stpnm: "1509 S Michigan"
                          lat: 41.861706666665
                          lon: -87.623969999999
                        - stpid: "1564"
                          stpnm: "3000 S Michigan"
                          lat: 41.840606666667
                          lon: -87.623206666667
                          dtrrem:
                            - "BFC46F62-990F-4AB4-A85C-3AF84574EC99"
                            - "50C633C7-0891-4E5A-83A8-FF0C6214BF69"
        '400':
          $ref: '#/components/responses/ErrorResponse'

  # ─────────────────────────────────────────────
  # GET PATTERNS
  # ─────────────────────────────────────────────
  /getpatterns:
    get:
      operationId: getPatterns
      summary: Get geo-positional patterns for a route or set of pattern IDs
      description: >
        Retrieve the set of geo-positional points and stops that, when connected, can be used
        to construct the geo-positional layout of a pattern (i.e., route variation).

        A pattern is a unique sequence of waypoints and stops that combine to form the path
        that a transit vehicle will repetitively travel. A route often has more than one possible pattern.

        Use `pid` to specify one or more specific pattern IDs (max 10).
        Use `rt` to get all active patterns for a route. Active patterns include:
        - One or more patterns marked as "default" for the route
        - All patterns currently being executed by at least one vehicle on the route

        **Note:** `pid` and `rt` cannot be combined. If both are specified, only the first
        parameter encountered will be processed.

        If a pattern was created by a detour, it will include a `dtrid` referencing the detour,
        and a `dtrpt` array containing the original (pre-detour) pattern points — useful
        for drawing dashed lines on a map.
      tags:
        - Patterns
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/locale'
        - name: pid
          in: query
          required: false
          description: >
            Comma-delimited list of pattern IDs (e.g. `"56,436,1221"`).
            Maximum of 10 identifiers. Cannot be combined with `rt`.
          schema:
            type: string
            example: "954"
        - name: rt
          in: query
          required: false
          description: >
            Route designator for which all active patterns should be returned.
            Cannot be combined with `pid`.
          schema:
            type: string
            example: "20"
      responses:
        '200':
          description: Successful response containing pattern geo-positional data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPatternsResponse'
              examples:
                pattern954:
                  summary: Pattern 954 (Westbound)
                  value:
                    bustime-response:
                      ptr:
                        - pid: 954
                          ln: 41113.0
                          rtdir: "Westbound"
                          pt:
                            - seq: 1
                              lat: 41.882155
                              lon: -87.625147000001
                              typ: "W"
                              pdist: 0.0
                            - seq: 2
                              lat: 41.88211
                              lon: -87.62515
                              typ: "W"
                              pdist: 0.0
                            - seq: 3
                              lat: 41.88211
                              lon: -87.62544
                              typ: "W"
                              pdist: 0.0
                            - seq: 4
                              lat: 41.8821
                              lon: -87.62585
                              typ: "W"
                              pdist: 0.0
                            - seq: 5
                              lat: 41.882129000001
                              lon: -87.625855
                              typ: "S"
                              stpid: "450"
                              stpnm: "Madison & Wabash"
                              pdist: 206.0
        '400':
          $ref: '#/components/responses/ErrorResponse'

  # ─────────────────────────────────────────────
  # GET PREDICTIONS
  # ─────────────────────────────────────────────
  /getpredictions:
    get:
      operationId: getPredictions
      summary: Get arrival/departure predictions for stops or vehicles
      description: >
        Retrieve arrival or departure predictions for one or more stops or one or more vehicles.
        Predictions are always returned in ascending order by `prdtm`.

        Use `stpid` to retrieve predictions for one or more stops (max 10).
        Use `vid` to retrieve predictions for one or more vehicles (max 10).

        **Note:** `stpid` and `vid` cannot be combined. If both are specified, only the first
        parameter encountered will be processed. Calls without either parameter are not allowed.

        The optional `rt` parameter can filter predictions by route(s) and is only available
        when using `stpid`.

        Use `top` to limit the number of predictions returned.

        Predictions for canceled stops will not be returned unless they are configured
        to be displayed publicly. Same applies to expressed stops.

        The `dyn` field indicates if a prediction has been affected by Disruption Management.
        Refer to the Dynamic Action Types section for interpretation.
      tags:
        - Predictions
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/locale'
        - name: stpid
          in: query
          required: false
          description: >
            Comma-delimited list of stop IDs (e.g. `"5029,1392,2019,4367"`).
            Maximum of 10 identifiers. Cannot be combined with `vid`.
          schema:
            type: string
            example: "456"
        - name: vid
          in: query
          required: false
          description: >
            Comma-delimited list of vehicle IDs (e.g. `"509,392,201,4367"`).
            Maximum of 10 identifiers. Cannot be combined with `stpid`.
          schema:
            type: string
            example: "8184,8140"
        - name: rt
          in: query
          required: false
          description: >
            Comma-delimited list of route designators to filter predictions.
            Only available when used with `stpid`.
          schema:
            type: string
            example: "20"
        - name: top
          in: query
          required: false
          description: Maximum number of predictions to return.
          schema:
            type: integer
            example: 5
        - name: tmres
          in: query
          required: false
          description: >
            Resolution of timestamps in the response.
            - `s` — resolution to the second (format: `YYYYMMDD HH:MM:SS`)
            - `m` — resolution to the minute (format: `YYYYMMDD HH:MM`, default)
          schema:
            type: string
            enum: [s, m]
            default: m
        - name: unixTime
          in: query
          required: false
          description: >
            If true, `tmstmp` and `prdtm` timestamps are returned as Unix epoch
            milliseconds instead of formatted date strings.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response containing prediction data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPredictionsResponse'
              examples:
                predictionsForStop:
                  summary: Predictions for stop 456 on route 20
                  value:
                    bustime-response:
                      prd:
                        - tmstmp: "20250421 16:04"
                          typ: "A"
                          stpnm: "Madison & Jefferson"
                          stpid: "456"
                          vid: "8184"
                          dstp: 686
                          rt: "20"
                          rtdd: "20"
                          rtdir: "Westbound"
                          des: "Austin"
                          prdtm: "20250421 16:06"
                          tablockid: "20 -803"
                          tatripid: "1040713"
                          origtatripno: "262522629"
                          dly: false
                          dyn: 0
                          prdctdn: "DUE"
                          zone: ""
                          psgld: ""
                          stst: 57120
                          stsd: "2025-04-21"
                          flagstop: 0
        '400':
          $ref: '#/components/responses/ErrorResponse'

  # ─────────────────────────────────────────────
  # GET LOCALES
  # ─────────────────────────────────────────────
  /getlocalelist:
    get:
      operationId: getLocaleList
      summary: Get available locales/languages
      description: >
        Retrieve a list of supported locales (languages) that can be passed as the `locale`
        parameter in all other API calls.

        Call this endpoint first to get valid locale strings, then optionally call it again
        with a `locale` parameter to see language names in that language.

        If `inLocaleLanguage=true` is passed, each locale's display name is returned in its
        own native language and takes precedence over the `locale` parameter.

        **Note:** The `locale` parameter in all requests supports the Java Locale inheritance model.
        If the given language is not supported, the TA's default language is used without indication.
        It is best to use a value from this list.
      tags:
        - Locales
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/locale'
        - name: inLocaleLanguage
          in: query
          required: false
          description: >
            If true, each locale's display name is returned in its own native language.
            Takes precedence over the `locale` parameter when true.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response containing available locales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLocaleListResponse'
              examples:
                defaultLocales:
                  summary: Default locale list (English)
                  value:
                    bustime-response:
                      locale:
                        - localestring: "en"
                          displayname: "English"
                        - localestring: "es"
                          displayname: "Spanish"
                localesInSpanish:
                  summary: Locale list with locale=es
                  value:
                    bustime-response:
                      locale:
                        - localestring: "en"
                          displayname: "inglés"
                        - localestring: "es"
                          displayname: "español"
                localesInNativeLanguage:
                  summary: Locale list with inLocaleLanguage=true
                  value:
                    bustime-response:
                      locale:
                        - localestring: "en"
                          displayname: "English"
                        - localestring: "es"
                          displayname: "español"
        '400':
          $ref: '#/components/responses/ErrorResponse'

  # ─────────────────────────────────────────────
  # GET DETOURS
  # ─────────────────────────────────────────────
  /getdetours:
    get:
      operationId: getDetours
      summary: Get active detours
      description: >
        Retrieve a list of detours in the system. Detours are considered "active" if they
        are currently affecting the current service day, even if the start time has not yet
        been reached or the end time has already passed.

        The response only contains metadata about the detour. The actual pattern data for the
        detour can be retrieved via `getpatterns` when an end user selects a route affected
        by the detour.

        Canceled or expired detours still appear in results — this handles cases where a
        vehicle is still running a canceled/expired detour and the developer wants to alert users.

        **Recommendation:** If supporting detours, request this endpoint frequently. When a
        new detour or version is added or a detour is canceled, also re-request stop and pattern
        data for the affected route/direction combinations.
      tags:
        - Detours
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/locale'
        - name: rt
          in: query
          required: false
          description: >
            Alphanumeric designator of the route (e.g. `"20"` or `"X20"`) for which
            detours should be returned. If omitted, all detours are returned.
          schema:
            type: string
            example: "20"
        - name: rtdir
          in: query
          required: false
          description: >
            Direction of travel of the route specified in `rt`. Must match the direction `id`
            from `getdirections`. The `rt` parameter is required when using `rtdir`.
          schema:
            type: string
            example: "Eastbound"
      responses:
        '200':
          description: Successful response containing detour metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDetoursResponse'
              examples:
                allDetours:
                  summary: All detours in system
                  value:
                    bustime-response:
                      dtrs:
                        - id: "84A97FD3-0741-4004-884D-0ABB22DAFA28"
                          ver: 2
                          st: 0
                          desc: "IVD MultiRoute detour 47"
                          rtdirs:
                            - rt: "72"
                              dir: "NORTHBOUND"
                          startdt: "20180404 08:45"
                          enddt: "20180430 03:00"
                        - id: "329E1F2D-A848-43E9-8F90-4FB00E643786"
                          ver: 1
                          st: 1
                          desc: "IVD Multiroute Detour S47/62"
                          rtdirs:
                            - rt: "800"
                              dir: "EASTBOUND"
                            - rt: "72M"
                              dir: "NORTHBOUND"
                          startdt: "20180404 09:06"
                          enddt: "20180430 03:00"
        '400':
          $ref: '#/components/responses/ErrorResponse'

  # ─────────────────────────────────────────────
  # GET ENHANCED DETOURS
  # ─────────────────────────────────────────────
  /getenhanceddetours:
    get:
      operationId: getEnhancedDetours
      summary: Get enhanced detour data (GTFS-RT)
      description: >
        Retrieve enhanced detour data including all detours that are currently active
        or will be active in the future. This endpoint is implemented for use by
        GTFS-RT systems and only returns data when detour support is enabled in BusTime.

        Unlike `getdetours`, this endpoint includes:
        - Google Encoded Polyline (`encpl`) for rendering detour paths on a map
        - Trip-level detail including affected trip IDs and active dates
        - Detour start and end stops within the pattern
        - Stops replaced by the detour (`repstops`)
        - Delay time introduced by the detour
        - Last modified timestamp (`moddt`)
        - Service bulletin name (`sbnm`)

        All datetime fields (`startdt`, `enddt`, `moddt`) are in Unix epoch milliseconds format.
      tags:
        - Enhanced Detours
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/locale'
      responses:
        '200':
          description: Successful response containing enhanced detour data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEnhancedDetoursResponse'
              examples:
                enhancedDetour:
                  summary: Enhanced detour with pattern, trips, and replaced stops
                  value:
                    bustime-response:
                      dtrs:
                        - id: "766CFD24-111D-40F0-9216-6E67576E603F"
                          ver: 2
                          st: 1
                          desc: "Detour with stops added and removed in multiple segments"
                          rtdirs:
                            - rt: "7"
                              dir: "WEST"
                          startdt: 1725595200000
                          enddt: 1727409600000
                          moddt: 1725631728000
                          ptrs:
